<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment complete — Navisual</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div class="return-card">
      <span class="return-icon" id="icon">✅</span>
      <h1 id="title">Payment complete</h1>
      <p id="msg">Your coins have been added. You can close this tab and return to Navisual — your
        balance updates automatically.</p>
    </div>
  </main>
  <script>
    // create-checkout sets cancel_url to ...?status=cancel
    if (new URLSearchParams(location.search).get('status') === 'cancel') {
      document.getElementById('icon').textContent = '↩️';
      document.getElementById('title').textContent = 'Checkout canceled';
      document.getElementById('msg').textContent =
        'No charge was made. You can close this tab and return to Navisual.';
    }
  </script>
</body>
</html>
